# Nginx reverse proxy configuration for 玄机子 (XuanJiZi)
#
# Place at: /etc/nginx/sites-available/xuanjizi
# Enable:   ln -s /etc/nginx/sites-available/xuanjizi /etc/nginx/sites-enabled/
# Test:     nginx -t
# Reload:   nginx -s reload

upstream bazi_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream bazi_mcp {
    server 127.0.0.1:8001;
    keepalive 16;
}

server {
    listen 80;
    server_name xuanjizi.example.com;

    # Redirect HTTP to HTTPS (uncomment after obtaining SSL cert)
    # return 301 https://$host$request_uri;

    client_max_body_size 2m;

    # Gzip compression
    gzip on;
    gzip_types text/css application/javascript application/json text/markdown;
    gzip_min_length 512;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    # API server
    location /api/ {
        proxy_pass http://bazi_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE streaming support (AI chat)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # MCP SSE endpoint
    location /sse {
        proxy_pass http://bazi_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # MCP messages endpoint
    location /messages/ {
        proxy_pass http://bazi_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Static files
    location /static/ {
        proxy_pass http://bazi_api;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Frontend pages
    location / {
        proxy_pass http://bazi_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Prometheus metrics (internal only — restrict in production)
    # location /api/metrics {
    #     allow 127.0.0.1;
    #     allow 10.0.0.0/8;
    #     deny all;
    #     proxy_pass http://bazi_api;
    #     proxy_set_header Host $host;
    # }
}

