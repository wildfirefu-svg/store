# Incremental type-check gate (CI "Type check (mypy)" step).
# Only the modules listed in `files` are enforced; they were clean at the time
# this gate was introduced. Add a module here once its mypy errors are fixed.
# follow_imports=silent keeps unfixed importers out of the gate while still
# using their type information.
[mypy]
# 3.12 (not the 3.11 runtime) because installed numpy stubs use 3.12-only
# `type` statements that fail to parse under 3.11; gated files use no
# version-specific syntax.
python_version = 3.12
ignore_missing_imports = True
follow_imports = silent
files =
    config.py,
    data_store.py,
    bazi_features.py,
    lunar_calendar.py,
    chart_domain_summary.py,
    prompt_engine.py,
    rag_prompt_builder.py,
    report_builder.py
