# BaziQA retrieval ablation configs.
#
# Source of truth for the 6 retrieval configurations consumed by
# scripts/run_baziqa_retrieval_ablation.py and case_index.load_retrieval_config.
#
# Each entry has the following fields:
#   id                : string, used as --config-id on the CLI and persisted
#                       into case_details.config_id (Task 3.4).
#   bm25              : bool, lexical BM25 base recall.
#   structured        : bool, structured chart_input feature matching
#                       (day_master / wuxing_stats / shishen_stats).
#   semantic          : bool, semantic-phrase reasoning extensions on top of
#                       structured matching.
#   tfidf_vector      : bool, TF-IDF cosine over fact strings (fallback when
#                       embedding_vector is disabled or unavailable).
#   embedding_vector  : bool, sentence-transformers embedding over fact strings.
#   embedding_model   : string, ST model name used when embedding_vector is
#                       true; empty when embedding_vector is false.
#   retrieval_mode    : optional benchmark prompt/trace mode.
#   option_evidence_k : optional per-option evidence count for option_grounded.

- id: bm25
  bm25: true
  structured: false
  semantic: false
  tfidf_vector: false
  embedding_vector: false
  embedding_model: ""

- id: structured
  bm25: true
  structured: true
  semantic: false
  tfidf_vector: false
  embedding_vector: false
  embedding_model: ""

- id: semantic
  bm25: true
  structured: true
  semantic: true
  tfidf_vector: false
  embedding_vector: false
  embedding_model: ""

- id: tfidf_vector
  bm25: true
  structured: true
  semantic: true
  tfidf_vector: true
  embedding_vector: false
  embedding_model: ""

- id: embedding_vector
  bm25: true
  structured: true
  semantic: true
  tfidf_vector: false
  embedding_vector: true
  embedding_model: "BAAI/bge-small-zh-v1.5"

- id: option_grounded_tfidf
  bm25: true
  structured: true
  semantic: true
  tfidf_vector: true
  embedding_vector: false
  embedding_model: ""
  retrieval_mode: option_grounded
  option_evidence_k: 2

- id: option_grounded_hybrid
  bm25: true
  structured: true
  semantic: true
  tfidf_vector: false
  embedding_vector: false
  embedding_model: ""
  retrieval_mode: option_grounded_hybrid
  option_evidence_k: 2
