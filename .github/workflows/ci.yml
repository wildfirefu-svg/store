name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Syntax check (all Python files)
        run: |
          python -c "
          import py_compile, glob, sys
          errors = []
          for pattern in ['*.py', 'knowledge-base/*.py', 'tests/*.py']:
              for f in glob.glob(pattern):
                  try:
                      py_compile.compile(f, doraise=True)
                  except py_compile.PyCompileError as e:
                      errors.append(str(e))
          if errors:
              print(f'{len(errors)} files failed to compile:')
              for e in errors:
                  print(f'  {e}')
              sys.exit(1)
          print(f'All Python files pass syntax check')
          "

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short --timeout=120 2>&1 || true
          echo "Tests completed (see output above)"

      - name: Verify Docker build
        run: |
          docker build -t xuanjizi-test .
          echo "Docker build succeeded"
