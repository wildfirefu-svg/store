name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Syntax check (all Python files)
        run: |
          python -c "
          import py_compile, sys
          from pathlib import Path
          errors = []
          excluded = {'.git', '.venv', '.tmp', '.cache', '.pytest_cache', '__pycache__'}
          for f in Path('.').rglob('*.py'):
              if any(part in excluded for part in f.parts):
                  continue
              try:
                  py_compile.compile(str(f), doraise=True)
              except py_compile.PyCompileError as e:
                  errors.append(str(e))
          if errors:
              print(f'{len(errors)} files failed to compile:')
              for e in errors:
                  print(f'  {e}')
              sys.exit(1)
          print(f'All Python files pass syntax check')
          "

      - name: Lint (ruff)
        run: |
          ruff check .

      - name: Type check (mypy)
        run: |
          mypy

      - name: Install CJK fonts (PDF report tests)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Build knowledge base database
        run: python knowledge-base/bazi_kb.py --build

      - name: Run tests
        run: |
          # e2e needs locally-installed Playwright browsers (playwright install);
          # CI runs the non-e2e suite, e2e stays a local opt-in (-m e2e).
          python -m pytest tests/ -v --tb=short --timeout=120 --ignore=tests/test_e2e.py

      - name: LLM report quality smoke test
        run: |
          python quality/llm_quality_test.py

      - name: Verify Docker build
        run: |
          docker build -t xuanjizi-test .
          echo "Docker build succeeded"

  affected-tests:
    # Fast path: run only the tests mapped to changed files
    # (see scripts/affected_tests.py). This job is a blocking early
    # signal; the full `test` job above remains the authoritative gate.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install CJK fonts (PDF report tests)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Build knowledge base database
        run: python knowledge-base/bazi_kb.py --build

      - name: Resolve affected tests
        id: affected
        run: |
          BASE="origin/${{ github.base_ref }}"
          if ! git rev-parse --verify "$BASE" >/dev/null 2>&1; then
            BASE="HEAD~1"
          fi
          FILES=$(python scripts/affected_tests.py --base "$BASE")
          echo "resolved: $FILES"
          { echo "tests<<EOF"; echo "$FILES"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Run affected tests
        if: steps.affected.outputs.tests != '# no test mapping needed for changed files'
        run: |
          if [ "${{ steps.affected.outputs.tests }}" = "FULL_SUITE" ]; then
            python -m pytest tests/ -q --tb=short --timeout=120 --ignore=tests/test_e2e.py
          else
            python -m pytest ${{ steps.affected.outputs.tests }} -q --tb=short --timeout=120 --ignore=tests/test_e2e.py
            rc=$?
            if [ $rc -eq 5 ]; then
              echo "Only e2e tests affected; e2e is not run in CI."
              exit 0
            fi
            exit $rc
          fi
