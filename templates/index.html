<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玄机子 · 八字命理分析</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=20260530k">
</head>
<body>
<div class="app-container" id="app-container">
    <!-- COL 0: 命主面板 -->
    <aside class="mingzhu-panel" id="mingzhu-panel">
        <div class="panel-header">
            <span class="panel-title">命主</span>
            <span class="panel-add" id="panel-add-btn" title="添加命主">＋</span>
            <span class="panel-toggle" id="panel-toggle" title="折叠面板">◀</span>
        </div>
        <div class="mingzhu-list" id="mingzhu-list">
            <div class="mingzhu-empty">点击 + 添加命主</div>
        </div>
        <div class="panel-footer">
            <span id="mingzhu-count">0 个命盘</span>
        </div>
    </aside>

    <!-- COL 1: 对话区 -->
    <section class="chat-column">
        <div class="chat-header">
            <span class="chat-title">玄机子</span>
            <span class="chat-subtitle" id="current-mingzhu-label"></span>
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="chat-welcome">
                <p><b>欢迎使用玄机子八字分析</b></p>
                <p>先添加命主，系统会生成八字与紫微命盘。</p>
                <p class="example">示例：公历 1993年7月15日 14:30 男 北京</p>
                <p class="welcome-action">点击左侧或下方的添加命主按钮开始。</p>
            </div>
        </div>
        <div class="chat-input-area">
            <div class="hehun-bar hidden" id="hehun-bar">
                <span style="font-weight:600">合婚模式</span>
                <select id="hehun-p1"></select>
                <span style="color:var(--text-tertiary)">×</span>
                <select id="hehun-p2"></select>
                <button id="hehun-analyze-btn">开始分析</button>
                <button id="hehun-close-btn">取消</button>
            </div>
            <div class="tool-bar hidden" id="zeri-bar">
                <span style="font-weight:600">择日</span>
                <input type="number" id="zeri-year" placeholder="年份" style="width:70px" min="2024" max="2100">
                <input type="number" id="zeri-month" placeholder="月份" style="width:55px" min="1" max="12">
                <select id="zeri-purpose">
                    <option value="结婚">结婚</option><option value="开业">开业</option>
                    <option value="搬家">搬家</option><option value="出行">出行</option>
                    <option value="签约">签约</option><option value="入学">入学</option>
                    <option value="通用">通用</option>
                </select>
                <button id="zeri-analyze-btn">查询</button>
                <button id="zeri-close-btn">取消</button>
            </div>
            <div class="tool-bar hidden" id="liunian-bar">
                <span style="font-weight:600">流年</span>
                <input type="number" id="liunian-year" placeholder="年份" style="width:80px" min="1900" max="2100">
                <button id="liunian-analyze-btn">查询</button>
                <button id="liunian-close-btn">取消</button>
            </div>
            <div class="tool-bar hidden" id="name-bar">
                <span style="font-weight:600">取名</span>
                <span class="name-tab active" data-ntab="eval" id="name-tab-eval">评测</span>
                <span class="name-tab" data-ntab="gen" id="name-tab-gen">推荐</span>
                <span id="name-eval-fields">
                    <input type="text" id="name-eval-name" placeholder="姓名" style="width:80px">
                    <select id="name-eval-gender"><option value="male">男</option><option value="female">女</option></select>
                </span>
                <span id="name-gen-fields" style="display:none">
                    <input type="text" id="name-gen-surname" placeholder="姓氏" style="width:60px" maxlength="1">
                    <select id="name-gen-gender"><option value="male">男</option><option value="female">女</option></select>
                </span>
                <button id="name-analyze-btn">查询</button>
                <button id="name-close-btn">取消</button>
            </div>
            <div class="chat-input-row">
                <button id="hehun-toggle-btn" title="合婚"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="4"/><circle cx="15" cy="17" r="4"/><path d="M1 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/><path d="M17 11h4a2 2 0 0 1 2 2v2"/></svg></button>
                <button id="zeri-toggle-btn" title="择日"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></button>
                <button id="liunian-toggle-btn" title="流年"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></button>
                <button id="name-toggle-btn" title="取名"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></button>
                <button id="add-mingzhu-btn" title="添加命主"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
                <button id="correct-btn" title="指正报告错误" style="display:none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg> 指正</button>
                <textarea id="chat-input" placeholder="输入出生信息或问题…" rows="1"></textarea>
                <button id="chat-send-btn">发送</button>
            </div>
        </div>
    </section>

    <!-- COL 2: 命盘展示 -->
    <section class="chart-column">
        <div class="chart-tabs">
            <span class="chart-tab active" data-chart="bazi">八字</span>
            <span class="chart-tab" data-chart="ziwei">紫微</span>
        </div>
        <div class="chart-section" id="bazi-section">
            <div id="bazi-table"><p style="color:var(--text-faint);font-size:12px;text-align:center;padding:20px">等待输入…</p></div>
            <div id="bazi-summary"></div>
        </div>
        <div class="chart-section hidden" id="ziwei-section">
            <div id="ziwei-table"><p style="color:var(--text-faint);font-size:12px;text-align:center;padding:20px">等待输入…</p></div>
        </div>
    </section>

    <!-- COL 3: 报告区 -->
    <section class="report-column">
        <div class="report-tabs" id="report-tabs">
            <span class="report-tab active" data-tab="overview">总览</span>
            <span class="report-correct-count hidden" id="correct-count"></span>
        </div>
        <div class="report-status done" id="report-status"></div>
        <button class="report-pdf-btn hidden" id="report-pdf-btn" title="下载PDF报告">📥 PDF</button>
        <div class="report-content" id="report-content">
            <p class="report-placeholder">输入出生信息后，报告将在此显示</p>
        </div>
    </section>

    <!-- 新增命主弹窗 -->
    <div class="modal hidden" id="add-mingzhu-modal">
        <div class="modal-content">
            <h3>添加命主</h3>
            <div class="toggle-row">
                <button class="toggle-btn active" data-cal="solar">公历</button>
                <button class="toggle-btn" data-cal="lunar">农历</button>
                <label class="solar-time-toggle">
                    <input type="checkbox" id="solar-time-check"> 真太阳时
                </label>
            </div>
            <div class="picker-row">
                <div class="picker"><label>年</label><input type="number" class="picker-inp" id="pick-year" value="1993" min="1900" max="2100"></div>
                <div class="picker"><label>月</label><input type="number" class="picker-inp" id="pick-month" value="7" min="1" max="12"></div>
                <div class="picker"><label>日</label><input type="number" class="picker-inp" id="pick-day" value="15" min="1" max="31"></div>
                <div class="picker"><label>时</label><input type="number" class="picker-inp" id="pick-hour" value="14" min="0" max="23"></div>
                <div class="picker"><label>分</label><input type="number" class="picker-inp" id="pick-minute" value="0" min="0" max="59"></div>
            </div>
            <div class="form-row">
                <input type="text" id="mingzhu-name" placeholder="姓名（可选）" style="flex:1">
                <select id="mingzhu-gender" style="flex:0.6">
                    <option value="male">男</option>
                    <option value="female">女</option>
                </select>
                <input type="text" id="mingzhu-location" placeholder="出生地" value="北京" style="flex:1;min-width:0">
            </div>
            <button id="mingzhu-submit-btn">排盘</button>
        </div>
    </div>

    <!-- Mobile bottom nav -->
    <nav class="mobile-nav" id="mobile-nav">
        <button class="mnav-btn active" data-panel="chat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> 对话</button>
        <button class="mnav-btn" data-panel="chart"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 16l4-8 4 4 4-6"/></svg> 命盘</button>
        <button class="mnav-btn" data-panel="report"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> 报告</button>
        <button class="mnav-btn" id="mnav-mingzhu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> 命主</button>
    </nav>
</div>
<script src="/static/app.js?v=20260530k"></script>
</body>
</html>
