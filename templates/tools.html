<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玄机子 · 自助工具</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="navbar">
    <div class="nav-brand">玄机子</div>
    <div class="nav-links">
        <a href="/">排盘分析</a>
        <a href="/tools">自助工具</a>
        <a href="/docs" target="_blank">API文档</a>
    </div>
</nav>
<main class="container">
<div class="hero">
    <h1>自助工具</h1>
    <p>择吉日 · 流年运势 · 姓名匹配 — 八字个人化分析</p>
</div>

<div class="tools-grid">
    <!-- Zeri -->
    <div class="card tool-card">
        <h2>择吉日</h2>
        <p>根据八字喜用神，推荐最佳日期</p>
        <form id="zeri-form" class="form-grid">
            <input type="hidden" id="zeri-chart-id">
            <div class="form-group"><label>目的</label><select id="zeri-purpose">
                <option>结婚</option><option>开业</option><option>搬家</option>
                <option>出行</option><option>签约</option><option>通用</option>
            </select></div>
            <div class="form-group"><label>年</label><input type="number" id="zeri-year" value="2026"></div>
            <div class="form-group"><label>月</label><input type="number" id="zeri-month" value="6" min="1" max="12"></div>
            <button type="submit" class="btn-primary">查找吉日</button>
        </form>
        <div id="zeri-result" class="tool-result"></div>
    </div>

    <!-- Liunian -->
    <div class="card tool-card">
        <h2>流年运势</h2>
        <p>12个月详细运势，四维评分</p>
        <form id="liunian-form" class="form-grid">
            <input type="hidden" id="liunian-chart-id">
            <div class="form-group"><label>目标年</label><input type="number" id="liunian-year" value="2026"></div>
            <button type="submit" class="btn-primary">查看运势</button>
        </form>
        <div id="liunian-result" class="tool-result"></div>
    </div>

    <!-- Name -->
    <div class="card tool-card">
        <h2>姓名匹配</h2>
        <p>评测已有名字或推荐新名字</p>
        <div class="tab-nav">
            <button class="tab-btn active" onclick="switchNameTab('eval')">评测名字</button>
            <button class="tab-btn" onclick="switchNameTab('gen')">取名推荐</button>
        </div>
        <form id="name-eval-form" class="form-grid">
            <input type="hidden" id="name-chart-id">
            <div class="form-group"><label>姓名（含姓）</label><input type="text" id="eval-name" placeholder="张伟"></div>
            <button type="submit" class="btn-primary">评测</button>
        </form>
        <form id="name-gen-form" class="form-grid hidden">
            <div class="form-group"><label>姓氏</label><input type="text" id="gen-surname" placeholder="张" maxlength="2"></div>
            <div class="form-group"><label>性别</label><select id="gen-gender"><option>male</option><option>female</option></select></div>
            <button type="submit" class="btn-primary">生成名字</button>
        </form>
        <div id="name-result" class="tool-result"></div>
    </div>
</div>
</main>
<footer class="footer">
    <p>基于中国传统命理学理论 · 仅供文化研究参考 · 不构成预测或决策依据</p>
</footer>
<script src="/static/js/api.js?v=20260604"></script>
<script src="/static/tools.js?v=20260604"></script>
</body>
</html>
