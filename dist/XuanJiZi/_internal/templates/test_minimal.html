<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><title>极简测试</title></head>
<body style="font-family:sans-serif;padding:20px">
<h2>极简测试 — 排盘 + 渲染</h2>
<form id="f">
年:<input id="y" value="1993" size="4">
月:<input id="m" value="7" size="2">
日:<input id="d" value="15" size="2">
时:<input id="h" value="14" size="2">
性别:<select id="g"><option>male</option><option>female</option></select>
<button type="submit">排盘</button>
</form>
<hr>
<div id="output" style="white-space:pre-wrap;font-family:monospace;font-size:12px;background:#f5f5f5;padding:10px;border-radius:4px"></div>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const out = document.getElementById('output');
    out.textContent = '排盘中...';
    try {
        const birth = {
            year: parseInt(document.getElementById('y').value),
            month: parseInt(document.getElementById('m').value),
            day: parseInt(document.getElementById('d').value),
            hour: parseInt(document.getElementById('h').value),
            gender: document.getElementById('g').value,
            location: '北京'
        };
        const r = await fetch('/api/chart', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify(birth)
        });
        if (!r.ok) { out.textContent = 'API ERROR: ' + r.status; return; }
        const d = await r.json();

        // Build display
        let lines = [];
        lines.push('=== chart_id: ' + d.chart_id);
        const dm = d.day_master;
        lines.push('日主: ' + dm.gan + dm.wuxing + dm.yinyang + '  长生: ' + (dm.shier_changsheng||''));
        lines.push('');

        // Four pillars table
        const fp = d.four_pillars;
        lines.push('四柱    ' + ['year','month','day','hour'].map(k => fp[k].gan + fp[k].zhi).join('  '));
        lines.push('纳音    ' + ['year','month','day','hour'].map(k => fp[k].nayin).join('  '));
        lines.push('十神    ' + ['year','month','day','hour'].map(k => k==='day'?'日主':fp[k].shi_shen_gan).join('  '));
        lines.push('');

        // Dayun
        const ds = d.dayun_summary;
        lines.push('起运: ' + ds.starting_age + '岁 ' + ds.direction);
        if (ds.current_pillar) {
            const cp = ds.current_pillar;
            lines.push('当前大运: ' + cp.gan + cp.zhi + ' (' + cp.start_age + '-' + cp.end_age + '岁)');
        }
        lines.push('');

        // Wuxing
        const ws = d.wuxing_stats;
        lines.push('五行: 金'+(ws.jin||0)+' 木'+(ws.mu||0)+' 水'+(ws.shui||0)+' 火'+(ws.huo||0)+' 土'+(ws.tu||0));
        if (ws.missing && ws.missing.length) lines.push('缺失: ' + ws.missing.join(','));
        lines.push('');

        // Shensha
        const ss = d.shensha || [];
        if (ss.length > 0) {
            lines.push('神煞:');
            ss.forEach(s => lines.push('  ' + s.name + ' @ ' + s.position + ' — ' + (s.meaning||'')));
        }
        lines.push('');

        // Ziwei
        const zw = d.ziwei || {};
        const zi = zw.basic_info || {};
        lines.push('=== 紫微斗数 ===');
        lines.push('命宫: ' + (zi.ming_gong_gan_zhi||'') + '  身宫: ' + (zi.shen_gong_position||'') + '  五行局: ' + (zi.wu_xing_ju||''));
        const palaces = zw.twelve_palaces || [];
        palaces.forEach(p => {
            lines.push(p.name + ' ' + (p.tian_gan||'')+(p.position||'') + ' ' + (p.main_stars||[]).join(' ') + ' ' + (p.auxiliary_stars||[]).join(' ') + ' ' + (p.daxian||''));
        });
        const sihua = zw.si_hua || [];
        if (sihua.length > 0) lines.push('四化: ' + sihua.map(s => (s.type||'') + (s.star||'')).join(' '));

        out.textContent = lines.join('\n');
    } catch(e) {
        out.textContent = 'ERROR: ' + e.message;
    }
});
</script>
</body>
</html>
